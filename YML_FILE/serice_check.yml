---
- hosts: all
  become: yes
  tasks:
    - name: Start the httpd service
      ansible.builtin.service:
        name: httpd
        state: started
      register: httpd_start
      when: ansible_os_family == "RedHat"

    - name: Restart the httpd service if not running
      ansible.builtin.service:
        name: httpd
        state: restarted
      register: httpd_restart
      when: ansible_os_family == "RedHat" and httpd_start.state != "started"

    - name: Display the httpd service status
      debug:
        msg: "httpd service is {{ httpd_start.state }} on {{ inventory_hostname }}"
      when: ansible_os_family == "RedHat"

